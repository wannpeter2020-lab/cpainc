{% extends "base.html" %}
{% block title %}Edit Payment — CPAinc{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="/booking/{{ check.BookingID }}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to Booking</a>
  <h4 class="mt-1">Edit Payment Record</h4>
  <p class="text-muted small">Booking ID: <code>{{ check.BookingID }}</code></p>
</div>

<div class="card" style="max-width:560px">
  <div class="card-header">Payment Details</div>
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Check Number</label>
        <input type="text" name="check_number" class="form-control" value="{{ check.Check_ or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Final Payment Amount</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" step="0.01" name="final_payment" class="form-control" value="{{ check.FinalPayment or '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Date on Check</label>
        <input type="date" name="date_on_check" class="form-control" value="{{ (check.DateOnCheck or '')[:10] }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Deposit Date</label>
        <input type="date" name="deposit_date" class="form-control" value="{{ (check.DepositDate or '')[:10] }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Special Notes</label>
        <textarea name="special_notes" class="form-control" rows="3">{{ check.SpecialNotes or '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
        <a href="/booking/{{ check.BookingID }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
