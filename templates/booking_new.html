{% extends "base.html" %}
{% block title %}New Booking — CPAinc{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to Bookings</a>
  <h4 class="mt-1">New Booking</h4>
  {% if prefill %}
  <div class="alert alert-info py-2 mt-2"><i class="bi bi-info-circle me-1"></i>Pre-filled from housing history import — review and save.</div>
  {% endif %}
</div>
<form method="post">
  <div class="card mb-4">
    <div class="card-header">Booking Info</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Booking ID *</label>
          <input type="text" name="BookingId" class="form-control" required value="{{ prefill.get('BookingId', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Booking Associate</label>
          <input type="text" name="BookingAssociate" class="form-control" value="Peter Wann">
        </div>
        <div class="col-md-3">
          <label class="form-label">Booking Status</label>
          <select name="BookingStatus" class="form-select">
            <option>Definite</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Booking Type</label>
          <select name="BookingType" class="form-select">
            <option>Hotel</option>
            <option>Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Booking Name <span class="text-muted small">(if different from Event Name)</span></label>
          <input type="text" name="BookingName" class="form-control" value="{{ prefill.get('BookingName', '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Event Name</label>
          <input type="text" name="EventName" class="form-control" value="{{ prefill.get('EventName', '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Account Name</label>
          <input type="text" name="AccountName" class="form-control" value="{{ prefill.get('AccountName', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Booked Date</label>
          <input type="date" name="BookedDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Start Date</label>
          <input type="date" name="StartDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">End Date</label>
          <input type="date" name="EndDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Addendum</label>
          <select name="Addendum" class="form-select">
            <option value="N">N</option>
            <option value="Y">Y</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header">Hotel / Property</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Hotel Name (Customer)</label>
          <input type="text" name="Customer" class="form-control" value="{{ prefill.get('Customer', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Brand</label>
          <input type="text" name="Brand" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Chain</label>
          <input type="text" name="Chain" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Address</label>
          <input type="text" name="Address" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">City</label>
          <input type="text" name="City" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">State</label>
          <input type="text" name="State" class="form-control" maxlength="2">
        </div>
        <div class="col-md-3">
          <label class="form-label">Country</label>
          <input type="text" name="Country" class="form-control" value="US">
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header">Financials</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">Peak Rooms</label>
          <input type="number" name="PeakRooms" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Total Room Nights</label>
          <input type="number" name="TotalRoomNights" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Room Rate</label>
          <input type="number" step="0.01" name="RoomRate" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Contracted Amount</label>
          <input type="number" step="0.01" name="ContractedAmount" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Revenue</label>
          <input type="number" step="0.01" name="Revenue" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Other Revenue</label>
          <input type="number" step="0.01" name="OtherRevenue" class="form-control" value="0">
        </div>
        <div class="col-md-2">
          <label class="form-label">Currency</label>
          <input type="text" name="Currency" class="form-control" value="USD">
        </div>
        <div class="col-md-2">
          <label class="form-label">Exchange Rate</label>
          <input type="number" step="0.0001" name="ExchangeRate" class="form-control" value="1">
        </div>
        <div class="col-md-2">
          <label class="form-label">USD Rate</label>
          <input type="number" step="0.01" name="USDRate" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">USD Revenue</label>
          <input type="number" step="0.01" name="USDRevenue" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Commission %</label>
          <input type="number" step="0.001" name="CommissionPercent" class="form-control" placeholder="e.g. 0.10" value="{{ prefill.get('CommissionPercent', '') }}">
        </div>
        <div class="col-md-2">
          <label class="form-label">USD Commissionable Amt</label>
          <input type="number" step="0.01" name="USDCommissionableAmount" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Advance</label>
          <select name="Advance" class="form-select">
            <option value="N">N</option>
            <option value="Y">Y</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Share Type</label>
          <input type="text" name="ShareType" class="form-control">
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Booking</button>
    <a href="/" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
