<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — CPAinc Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; font-family: Arial, sans-serif; }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
      border: none;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }
    .login-header {
      background: #1a3a5c;
      color: #fff;
      border-radius: .375rem .375rem 0 0;
      padding: 1.5rem;
      text-align: center;
    }
    .btn-primary { background: #1a3a5c; border-color: #1a3a5c; }
    .btn-primary:hover { background: #14304d; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="login-header">
    <i class="bi bi-building fs-2"></i>
    <h4 class="mb-0 mt-2">CPAinc Pipeline</h4>
    <div class="small" style="color:#aed6f1">Sign in to continue</div>
  </div>
  <div class="card-body p-4">
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" autofocus required placeholder="peter or peter.wann@...">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
      </button>
    </form>
  </div>
  <div class="card-footer text-center text-muted small py-2">
    ConferenceDirect — CPAinc
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
